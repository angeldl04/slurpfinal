<!DOCTYPE html>
<html lang="es">

<head>
    <title>Experiencia SLURP AR</title>
    <meta charset="utf-8">
    <meta name="generator" content="Three.js Editor">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    
    <!-- Tipografías de Google Fonts combinadas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Titan+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">

    <style>
        /* ESTILOS DE MARCA SLURP PARA EL OVERLAY (Desde index1.html) */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #aae019; /* Verde dominante de la marca */
            background-image: radial-gradient(circle at center, #c8ff2b 0%, #95c714 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            font-family: 'Titan One', cursive; /* Tipografía gruesa y dinámica */
            transition: opacity 0.4s ease;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Contenedor del logo para la pantalla de carga */
        #brand-logo {
            max-width: 280px;
            margin-bottom: 40px;
            filter: drop-shadow(5px 5px 0px rgba(0,0,0,0.8));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Botón estilo cómic/exagerado */
        #start-button {
            background-color: #ff1493; /* Rosa/Fucsia para destacar */
            color: #ffffff;
            font-family: 'Titan One', cursive;
            font-size: 26px;
            padding: 15px 50px;
            border: 4px solid #000000;
            border-radius: 40px; /* Formas curvas */
            cursor: pointer;
            box-shadow: 6px 6px 0px #000000;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.1s ease;
        }

        #start-button:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0px #000000;
        }

        /* Selector de experiencias: lenguaje gráfico SLURP */
        #mode-selection {
            width: min(92vw, 760px);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
            padding: 0 18px;
            box-sizing: border-box;
        }

        #mode-title {
            margin: 0;
            color: #111;
            font-family: 'Anton', sans-serif;
            font-size: clamp(30px, 6vw, 48px);
            line-height: 1;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 #fff;
            transform: rotate(-1deg);
        }

        #mode-subtitle {
            margin: 0 0 12px;
            color: #111;
            font-family: 'Titan One', cursive;
            font-size: clamp(13px, 2.5vw, 17px);
            text-shadow: 1px 1px 0 rgba(255,255,255,.75);
        }

        .mode-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
            width: 100%;
        }

        .mode-button {
            position: relative;
            display: flex;
            min-height: 190px;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 10px;
            padding: 26px 24px;
            border: 4px solid #000;
            border-radius: 25px;
            color: #111;
            font-family: 'Titan One', cursive;
            text-align: left;
            cursor: pointer;
            box-shadow: 8px 8px 0 #000;
            transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .mode-face {
            background: #ff1493;
            color: #fff;
        }

        .mode-image {
            background: #02e4d7;
            color: #111;
        }

        .mode-button::after {
            content: '';
            position: absolute;
            inset: 7px;
            border: 2px dashed rgba(0,0,0,.35);
            border-radius: 15px;
            pointer-events: none;
        }

        .mode-button:hover {
            transform: translate(-3px, -4px) rotate(-1deg);
            box-shadow: 11px 12px 0 #000;
            filter: saturate(1.08);
        }

        .mode-image:hover {
            transform: translate(-3px, -4px) rotate(1deg);
        }

        .mode-button:active {
            transform: translate(5px, 5px);
            box-shadow: 3px 3px 0 #000;
        }

        .mode-button:focus-visible {
            outline: 4px solid #fff;
            outline-offset: 7px;
        }

        .mode-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 42px;
            height: 32px;
            padding: 0 8px;
            border: 3px solid #000;
            border-radius: 999px;
            background: #c5f608;
            color: #111;
            font-family: 'Anton', sans-serif;
            font-size: 17px;
            line-height: 1;
            box-shadow: 3px 3px 0 #000;
        }

        .mode-name {
            max-width: 100%;
            font-size: clamp(18px, 2.6vw, 25px);
            line-height: 1.05;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 rgba(0,0,0,.18);
        }

        .mode-description {
            max-width: 85%;
            font-family: 'Anton', sans-serif;
            font-size: 15px;
            letter-spacing: .4px;
            text-transform: uppercase;
        }

        .mode-arrow {
            position: absolute;
            right: 20px;
            bottom: 17px;
            z-index: 1;
            font-family: Arial, sans-serif;
            font-size: 30px;
            line-height: 1;
            transform: rotate(-35deg);
        }

        #mode-message {
            min-height: 22px;
            margin: 5px 0 0;
            color: #111;
            font-family: 'Anton', sans-serif;
            font-size: 14px;
            text-align: center;
            text-shadow: 1px 1px 0 #fff;
        }

        @media (max-width: 600px) {
            #brand-logo {
                width: min(58vw, 230px);
                margin-bottom: 26px;
            }

            .mode-options {
                grid-template-columns: 1fr;
                gap: 16px;
                max-width: 420px;
            }

            .mode-button {
                min-height: 145px;
                padding: 20px 22px;
                border-radius: 22px;
            }

            .mode-name {
                font-size: clamp(19px, 6vw, 24px);
            }

            .mode-description {
                font-size: 13px;
            }
        }

        #progress-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
            width: 80%;
            max-width: 350px;
        }

        #progress-bar-track {
            width: 100%;
            height: 30px;
            background-color: #2b82d9; /* Azul de los detalles del empaque */
            border: 4px solid #000000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0px 4px 0px rgba(0,0,0,0.2);
        }

        #progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #ff1493; /* Rosa de la marca */
            transition: width 0.3s ease;
            box-shadow: inset 0px 4px 0px rgba(255,255,255,0.3);
        }

        #progress-label {
            margin-top: 15px;
            color: #000000;
            font-size: 20px;
            text-shadow: 2px 2px 0px #ffffff; /* Contraste llamativo */
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "./js/three.compat.js",
            "three/addons/": "./js/addons/",
            "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
    }
    </script>

    <script type="module">
        import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/loaders/GLTFLoader.js';
        window.ThreeGLTFLoader = GLTFLoader;
    </script>
</head>

<body ontouchstart="">

    <div id="ar-container"></div>

    <!-- Experiencia de filtro facial: video, ayudas 2D y escena Three.js --> 
    <div id="face-experience" class="face-experience" aria-label="Filtro facial SLURP">
        <div id="app">
            <video id="video-renderer" autoplay playsinline muted></video>
            <canvas id="canvas-renderer"></canvas>
        </div>
    </div>

    <!-- Botones de información: aparecen cuando la cámara detecta el marcador (Desde index.html) -->
    <div id="ar-buttons" class="oculto">
        <button class="ar-btn" data-info="conocenos" data-color="#F81390">Conócenos</button>
        <button class="ar-btn" data-info="diversion" data-color="#02E4D7">Más Diversión</button>
        <button class="ar-btn" data-info="arriesgate" data-color="#C5F608">Arriésgate</button>
    </div>

    <!-- Panel de información (Desde index.html) -->
    <div id="info-panel" class="oculto">
        <button id="info-close" aria-label="Cerrar">✕</button>
        <h2 id="info-title"></h2>
        <p id="info-text"></p>
    </div>

    <div class="log" id="log" style="display:none;"></div> <!-- Oculto para mantener interfaz limpia -->

    <!-- Overlay combinado con logo y botón estilizado (Desde index1.html) -->
    <div id="overlay">
        <img id="brand-logo" src="assets/Logotipo burbuja brillante SLWIP.png" alt="SLURP Logo">
        
        <div id="mode-selection">
            <h1 id="mode-title">ELIGE TU EXPERIENCIA</h1>
            <p id="mode-subtitle">¿A qué universo quieres entrar?</p>
            <div class="mode-options">
                <button class="mode-button mode-face" id="face-mode-button" type="button">
                    <span class="mode-number">01</span>
                    <span class="mode-name">FILTRO FACIAL</span>
                    <span class="mode-description">Interactúa con tu rostro</span>
                    <span class="mode-arrow">➜</span>
                </button>
                <button class="mode-button mode-image" id="image-mode-button" type="button">
                    <span class="mode-number">02</span>
                    <span class="mode-name">SEGUIMIENTO DE IMAGEN</span>
                    <span class="mode-description">Descubre la experiencia SLURP</span>
                    <span class="mode-arrow">➜</span>
                </button>
            </div>
            <p id="mode-message" role="status" aria-live="polite"></p>
        </div>
        
        <div id="progress-container">
            <div id="progress-bar-track">
                <div id="progress-bar-fill"></div>
            </div>
            <div id="progress-label">Sirviendo... 0%</div>
        </div>
    </div>

    <script type="module">

        import * as THREE from './js/three.module.js';
        import ThreePlayer from './js/app.js';
        import { startFaceFilter } from './js/mediapipe/mediapipe_controller.js';
        import { MindARController } from './js/mindar/mindar_controller.js';

        window.THREE = THREE;

        const log = document.getElementById('log');
        const overlay = document.getElementById('overlay');
        const faceModeButton = document.getElementById('face-mode-button');
        const imageModeButton = document.getElementById('image-mode-button');
        const modeSelection = document.getElementById('mode-selection');
        const modeMessage = document.getElementById('mode-message');
        const arContainer = document.getElementById('ar-container');
        const faceExperience = document.getElementById('face-experience');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-bar-fill');
        const progressLabel = document.getElementById('progress-label');

        const debugMode = new URLSearchParams(location.search).get('debug') === '1';
        if (!debugMode) log.style.display = 'none';

        // ------------------------------------------------------------------
        // Contenido de los botones de información (Desde index.html)
        // ------------------------------------------------------------------
        const MARCA = 'Slurp';

        const INFO = {
            conocenos: {
                titulo: 'Conócenos',
                texto: `${MARCA} nació en una galaxia muy, muy lejana con una misión: que ninguna fiesta vuelva a ser aburrida. Es la bebida burbujeante y de colores brillantes que mezcla sabores de otro mundo con una dosis extra de diversión. Su receta es un secreto cósmico, pero su efecto es universal: donde hay ${MARCA}, hay fiesta.`
            },
            diversion: {
                titulo: 'Más Diversión',
                texto: `La familia ${MARCA} se expande por el universo: Nebulosa, con frutos rojos y destellos brillantes; Supernova, un cítrico explosivo con burbujas extra; Agujero Negro, de sabor oscuro e intenso que atrapa a cualquiera; Andrómeda, una mezcla tropical en lata edición galáctica; y Saturno, de uva con "anillos" de gelatina comestible. ¡Elige tu órbita favorita!`
            },
            arriesgate: {
                titulo: 'Arriésgate',
                texto: `Prepárate para despegar: diversión extrema, cero cansancio y energía infinita. Con cada sorbo sentirás que la fiesta apenas comienza, que la música no se detiene y que tu batería social nunca se agota. ¿Te atreves a probarlo?`
            }
        };

        const arButtons = document.getElementById('ar-buttons');
        const infoPanel = document.getElementById('info-panel');
        const infoTitle = document.getElementById('info-title');
        const infoText = document.getElementById('info-text');

        document.querySelectorAll('.ar-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                const data = INFO[btn.dataset.info];
                infoTitle.textContent = data.titulo;
                infoText.textContent = data.texto;
                infoPanel.style.setProperty('--c', btn.dataset.color);
                infoPanel.classList.remove('oculto');
            });
        });

        document.getElementById('info-close').addEventListener('click', () => {
            infoPanel.classList.add('oculto');
        });

        // ------------------------------------------------------------------

        let player = null;
        let mindarController = null;
        let loaded = false;
        let loadPromise = null;

        function setProgress(percent, text) {
            progressFill.style.width = `${percent}%`;
            progressLabel.textContent = `${text} ${percent}%`;
        }

        async function loadEverything() {
            if (loadPromise) return loadPromise;

            loadPromise = (async () => {
                setProgress(0, 'Sirviendo SLURP...');

                // La escena se descarga una sola vez y se interpreta con el
                // mismo ThreePlayer que usa el controlador de seguimiento.
                player = new ThreePlayer(arContainer);
                await player.loadProject('app.json', ({ progress }) => {
                    const percent = Math.round(progress * 70);
                    setProgress(percent, 'Sirviendo SLURP...');
                }, {
                    // La experiencia de seguimiento carga únicamente su grupo.
                    rootGroupName: '02 - Experiencia ImageTarget'
                });

                player.resize();
                setProgress(100, '¡Experiencia lista!');
                loaded = true;
                window.player = player;

                window.addEventListener('resize', () => {
                    if (player) player.resize();
                });
            })().catch((error) => {
                loaded = false;
                loadPromise = null;
                throw error;
            });

            return loadPromise;
        }

        async function startImageExperience() {
            modeSelection.style.display = 'none';
            progressContainer.style.display = 'flex';

            try {
                await loadEverything();
                if (!loaded) return;

                setProgress(90, 'Iniciando cámara...');

                mindarController = new MindARController(arContainer, player, debugMode);
                window.mindarController = mindarController;

                mindarController.addListener('found', () => {
                    arButtons.classList.remove('oculto');
                });

                mindarController.addListener('lost', () => {
                    arButtons.classList.add('oculto');
                    infoPanel.classList.add('oculto');
                });

                await mindarController.start();

                if (player?.renderer?.domElement) player.renderer.domElement.style.display = 'none';

                overlay.classList.add('hidden');
                setTimeout(() => overlay.remove(), 400);
            } catch (e) {
                console.error('Error durante la carga:', e);
                modeSelection.style.display = 'flex';
                progressContainer.style.display = 'none';
                modeMessage.textContent = 'No pudimos iniciar la experiencia. Inténtalo de nuevo.';
                setProgress(0, 'Error al iniciar');
            }
        }

        imageModeButton.addEventListener('click', startImageExperience);

        let faceFilter = null;
        let faceStarting = false;

        async function startFaceExperience() {
            if (faceStarting || faceFilter) return;
            faceStarting = true;
            modeSelection.style.display = 'none';
            progressContainer.style.display = 'flex';
            faceExperience.classList.add('active');
            setProgress(10, 'Preparando cámara...');

            try {
                // El controlador facial carga app.json por su cuenta y ejecuta
                // los scripts de la escena con los eventos de MediaPipe.
                setProgress(35, 'Activando reconocimiento facial...');
                faceFilter = await startFaceFilter('face-scene.json', { showGui: false });

                setProgress(100, '¡Filtro listo!');
                overlay.classList.add('hidden');
                setTimeout(() => overlay.remove(), 400);
            } catch (error) {
                console.error('Error al iniciar el filtro facial:', error);
                faceExperience.classList.remove('active');
                modeSelection.style.display = 'flex';
                progressContainer.style.display = 'none';
                modeMessage.textContent = 'No pudimos iniciar el filtro facial. Verifica los permisos de cámara e inténtalo de nuevo.';
                setProgress(0, 'Error al iniciar');
                faceStarting = false;
            }
        }

        faceModeButton.addEventListener('click', startFaceExperience);

    </script>
</body>
</html>
